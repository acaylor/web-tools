name: Release new versions

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: web-tools
    container:
      image: node:24-bookworm
    steps:
      - uses: actions/checkout@v5
      - name: Validate semantic version and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs "${RELEASE_TAG#v}" --verify
      - name: Test release workflow
        run: node --test scripts/release.test.mjs

  docker-release:
    needs: validate
    permissions:
      contents: read
      packages: write
    runs-on: web-tools
    steps:
      - name: Get release version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/acaylor/web-tools:latest
            ghcr.io/acaylor/web-tools:${{ env.RELEASE_VERSION}}

  github-release:
    permissions:
      contents: write
    runs-on: web-tools
    container:
      image: node:24-bookworm
    needs: docker-release
    steps:
      - name: Get release version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Install zip
        run: apt-get update && apt-get install -y zip

      - name: Checkout
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app
        run: pnpm build

      - name: Zip the app
        run: zip -r web-tools-${{ env.RELEASE_VERSION }}.zip dist/*

      - name: Get changelog
        id: changelog
        run: |
          EOF=$(openssl rand -hex 8)
          {
            echo "changelog<<$EOF"
            node ./scripts/getLatestChangelog.mjs "$RELEASE_VERSION"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: web-tools-${{ env.RELEASE_VERSION }}.zip
          tag_name: v${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false
          body: |
            ## Docker images

            - GitHub Container Registry
              - `ghcr.io/acaylor/web-tools:latest`
              - `ghcr.io/acaylor/web-tools:${{ env.RELEASE_VERSION}}`

            ## Changelog

            ${{ steps.changelog.outputs.changelog }}
